# TuiOS config — only overrides; everything else is the tuios default.

# Without this table startup.daemon and startup.tiled read as false
[startup]
daemon = true
# New sessions start tiled (binary space partitioning)
tiled = true
layout = "bsp"

[appearance]
# Remove the close/minimize/zoom buttons from pane title bars
hide_window_buttons = true
# One border between neighbouring panes instead of two
shared_borders = true

[appearance.sidebar]
# Hide the session rail
enabled = false
# Section order when shown (ctrl+space b): agents above files
sections = "sessions:25,terminals,agents:34,files:25"

[keybindings]
# Same prefix as the old zellij setup
leader_key = "ctrl+space"

# Pane focus on Opt+Shift+arrows, so Opt+arrows reach the shell for word movement
[keybindings.terminal_mode]
terminal_focus_left = ["alt+shift+left"]
terminal_focus_right = ["alt+shift+right"]
terminal_focus_up = ["alt+shift+up"]
terminal_focus_down = ["alt+shift+down"]

# Step through workspaces (zellij tabs) on Opt+Ctrl+arrows
[keybindings.global]
prev_workspace = ["alt+ctrl+left"]
next_workspace = ["alt+ctrl+right"]

# New session: name, then folder (like zellij's zsm on P f) on ctrl+space E
[[keybindings.command]]
key = "prefix+E"
type = "popup"
command = "tuios-new-session"
description = "New session: name, then folder"
